name: Release GamePlayer

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build GamePlayer
        run: .\build.bat

      - name: Run unit tests
        run: .\test.bat

      - name: Create draft, upload tested executable, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" --verify-tag --draft --title "GamePlayer $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release upload "$env:GITHUB_REF_NAME" build/GamePlayer.exe
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          gh release edit "$env:GITHUB_REF_NAME" --draft=false
